<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f2d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='21' fill='%23d83f2f'/%3E%3Cpath d='M33 16c2-8 8-11 15-10-2 7-7 11-15 10Z' fill='%234f7c3a'/%3E%3Cpath d='M31 18c0-5 1-9 4-13' fill='none' stroke='%236f5435' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>果园地图工坊</title>
  </head>
  <body>
    <main id="editor-app">
      <header class="editor-header">
        <a class="back-link" href="/" aria-label="返回游戏">← 返回果园</a>
        <div class="title-lockup">
          <span class="eyebrow">ORCHARD CARTOGRAPHY</span>
          <h1>果园地图工坊</h1>
        </div>
        <div class="header-actions">
          <button id="undo-button" type="button" title="撤销 Ctrl+Z">撤销</button>
          <button id="redo-button" type="button" title="重做 Ctrl+Shift+Z">重做</button>
          <button id="save-button" type="button">保存地图</button>
          <button id="play-button" class="primary-action" type="button">使用并游玩</button>
        </div>
      </header>

      <section class="editor-layout">
        <aside class="tool-shed" aria-label="地图工具">
          <div class="panel-heading">
            <span>01</span>
            <div><small>TOOL SHED</small><strong>造景工具</strong></div>
          </div>
          <div id="tool-list" class="tool-list">
            <button class="tool active" data-tool="tree" type="button"><b>♣</b><span>种树<small>1</small></span></button>
            <button class="tool" data-tool="erase" type="button"><b>⌫</b><span>擦除<small>2</small></span></button>
            <button class="tool" data-tool="path" type="button"><b>〰</b><span>小路<small>3</small></span></button>
            <button class="tool" data-tool="clearing" type="button"><b>◯</b><span>空地<small>4</small></span></button>
            <button class="tool" data-tool="apple" type="button"><b>●</b><span>果实<small>5</small></span></button>
            <button class="tool" data-tool="kid" type="button"><b>◆</b><span>小偷起点<small>6</small></span></button>
            <button class="tool" data-tool="guard1" type="button"><b>▲</b><span>守卫一<small>7</small></span></button>
            <button class="tool" data-tool="guard2" type="button"><b>▲</b><span>守卫二<small>8</small></span></button>
            <button class="tool" data-tool="delivery" type="button"><b>◎</b><span>投递区<small>9</small></span></button>
          </div>

          <div class="control-block">
            <label for="tree-variant">树木品种</label>
            <select id="tree-variant">
              <option value="broadleaf">阔叶树</option>
              <option value="cherry">樱花树</option>
              <option value="pine">松树</option>
            </select>
          </div>
          <div class="control-block range-control">
            <label for="brush-size">画笔半径 <output id="brush-size-value">1.6</output></label>
            <input id="brush-size" type="range" min="0.7" max="3.6" step="0.1" value="1.6" />
          </div>
          <p class="tool-hint">在地图上拖动。小路和空地会自动清除附近树木。</p>
        </aside>

        <section class="map-board">
          <div class="map-meta">
            <label>
              <span>地图名称</span>
              <input id="map-name" maxlength="40" value="我的果园" />
            </label>
            <div id="map-status" class="map-status" data-state="checking">正在检查路径…</div>
          </div>
          <div id="canvas-shell" class="canvas-shell">
            <canvas id="map-editor-canvas" aria-label="果园地图编辑画布"></canvas>
            <div class="map-legend" aria-hidden="true">
              <span><i class="legend-kid"></i>小偷</span>
              <span><i class="legend-guard"></i>守卫</span>
              <span><i class="legend-apple"></i>果实</span>
              <span><i class="legend-goal"></i>投递区</span>
            </div>
          </div>
          <div id="validation-list" class="validation-list" aria-live="polite"></div>
        </section>

        <aside class="seed-lab">
          <div class="panel-heading">
            <span>02</span>
            <div><small>SEED LAB</small><strong>随机地图实验室</strong></div>
          </div>
          <div class="generator-grid">
            <label>结构预置
              <select id="preset-select">
                <option value="clearings">林间空地</option>
                <option value="winding">蜿蜒果径</option>
                <option value="crossroads">交错林路</option>
              </select>
            </label>
            <label>随机种子
              <input id="seed-input" type="number" min="1" step="1" value="20260815" />
            </label>
            <label class="range-control">树林密度 <output id="density-value">78%</output>
              <input id="density-input" type="range" min="35" max="100" value="78" />
            </label>
            <label class="range-control">道路宽度 <output id="path-width-value">2.4</output>
              <input id="path-width-input" type="range" min="1.8" max="4.2" step="0.1" value="2.4" />
            </label>
          </div>
          <button id="generate-button" class="generate-button" type="button">生成四个候选</button>
          <div id="candidate-list" class="candidate-list" aria-label="随机地图候选"></div>

          <div class="library-heading">
            <span>我的地图</span>
            <div>
              <button id="export-button" type="button">导出</button>
              <button id="import-button" type="button">导入</button>
              <input id="import-input" type="file" accept="application/json,.json" hidden />
            </div>
          </div>
          <div id="saved-map-list" class="saved-map-list"></div>
        </aside>
      </section>
      <div id="editor-toast" class="editor-toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
