<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f2d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='21' fill='%23d83f2f'/%3E%3Cpath d='M33 16c2-8 8-11 15-10-2 7-7 11-15 10Z' fill='%234f7c3a'/%3E%3Cpath d='M31 18c0-5 1-9 4-13' fill='none' stroke='%236f5435' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>果园地图工坊</title>
  </head>
  <body>
    <main id="editor-app">
      <header class="editor-header">
        <a class="back-link" href="/" aria-label="返回游戏">← 返回果园</a>
        <div class="title-lockup">
          <span class="eyebrow">ORCHARD CARTOGRAPHY</span>
          <h1>果园地图工坊</h1>
        </div>
        <div class="header-actions">
          <button id="undo-button" type="button" title="撤销 Ctrl+Z">撤销</button>
          <button id="redo-button" type="button" title="重做 Ctrl+Shift+Z">重做</button>
          <button id="save-button" type="button">保存地图</button>
          <button id="play-button" class="primary-action" type="button">使用并游玩</button>
        </div>
      </header>

      <section class="editor-layout">
        <aside class="tool-shed" aria-label="地图工具">
          <div class="panel-heading">
            <span>01</span>
            <div><small>TOOL SHED</small><strong>造景工具</strong></div>
          </div>
          <div id="tool-list" class="tool-list">
            <button class="tool" data-tool="island-select" type="button"><b>◇</b><span>岛屿结构<small>R</small></span></button>
            <button class="tool active" data-tool="tree" type="button"><b>♣</b><span>种树<small>1</small></span></button>
            <button class="tool" data-tool="erase" type="button"><b>⌫</b><span>擦除<small>2</small></span></button>
            <button class="tool" data-tool="homestead" type="button"><b>⌂</b><span>KayKit 建筑<small>3</small></span></button>
            <button class="tool" data-tool="pond" type="button"><b>◉</b><span>池塘<small>4</small></span></button>
            <button class="tool" data-tool="orchard" type="button"><b>▥</b><span>果园地块<small>5</small></span></button>
            <button class="tool" data-tool="meadow" type="button"><b>◯</b><span>草地空场<small>6</small></span></button>
            <button class="tool" data-tool="path" type="button"><b>≋</b><span>铺设宽路<small>E</small></span></button>
            <button class="tool" data-tool="apple" type="button"><b>●</b><span>果实<small>7</small></span></button>
            <button class="tool" data-tool="kid" type="button"><b>◆</b><span>小偷起点<small>8</small></span></button>
            <button class="tool" data-tool="guard1" type="button"><b>▲</b><span>守卫一<small>9</small></span></button>
            <button class="tool" data-tool="guard2" type="button"><b>▲</b><span>守卫二<small>Q</small></span></button>
            <button class="tool" data-tool="delivery" type="button"><b>◎</b><span>投递区<small>W</small></span></button>
          </div>

          <div class="world-style-grid" aria-label="KayKit 世界样式">
            <label for="world-theme">世界主题
              <select id="world-theme">
                <option value="village">林间村落</option>
                <option value="riverside">河畔集市</option>
                <option value="fortified">城堡果园</option>
              </select>
            </label>
            <label for="tile-shape">地块形状
              <select id="tile-shape">
                <option value="square">方形地块（推荐）</option>
                <option value="hex">六边形地块</option>
              </select>
            </label>
          </div>

          <div class="control-block building-controls">
            <label for="building-asset">建筑模型</label>
            <select id="building-asset">
              <option value="house">住宅</option>
              <option value="market">集市</option>
              <option value="farmPlot">农田</option>
              <option value="lumbermill">伐木场</option>
              <option value="mill">风车磨坊</option>
              <option value="watermill">水车磨坊</option>
              <option value="well">水井</option>
              <option value="archeryRange">靶场</option>
              <option value="barracks">兵营</option>
              <option value="watchtower">瞭望塔</option>
              <option value="castle">城堡</option>
              <option value="mine">矿山入口</option>
            </select>
            <label for="building-rotation">建筑朝向</label>
            <select id="building-rotation">
              <option value="0">正向 0°</option>
              <option value="1">右转 90°</option>
              <option value="2">背向 180°</option>
              <option value="3">左转 270°</option>
            </select>
          </div>

          <div class="control-block">
            <label for="tree-variant">障碍品种</label>
            <select id="tree-variant">
              <option value="stump">树桩（推荐）</option>
              <option value="broadleaf">阔叶树</option>
              <option value="cherry">樱花树</option>
              <option value="pine">松树</option>
            </select>
          </div>
          <div class="control-block range-control">
            <label for="brush-size">画笔半径 <output id="brush-size-value">4.5</output></label>
            <input id="brush-size" type="range" min="1.5" max="11" step="0.5" value="4.5" />
          </div>
          <form id="island-geometry-panel" class="island-geometry-panel" hidden>
            <div class="island-geometry-heading">
              <small>ISLAND GEOMETRY</small>
              <strong id="island-geometry-title">选择岛屿结构</strong>
            </div>
            <div id="island-geometry-fields" class="island-geometry-fields" hidden>
              <label for="island-geometry-x">中心 X
                <input id="island-geometry-x" type="number" step="0.1" />
              </label>
              <label for="island-geometry-z">中心 Z
                <input id="island-geometry-z" type="number" step="0.1" />
              </label>
              <label for="island-geometry-size-x"><span id="island-geometry-size-x-label">半宽 X</span>
                <input id="island-geometry-size-x" type="number" min="0.5" step="0.1" />
              </label>
              <label for="island-geometry-size-z"><span id="island-geometry-size-z-label">半深 Z</span>
                <input id="island-geometry-size-z" type="number" min="0.5" step="0.1" />
              </label>
            </div>
            <p id="island-geometry-note">在画布中选择区域、矩形通路块或桥梁。</p>
            <button id="island-geometry-apply" type="submit" disabled>应用结构修改</button>
          </form>
          <section id="delivery-zone-panel" class="delivery-zone-panel" aria-label="多投递点管理" hidden>
            <div class="delivery-zone-heading">
              <div><small>DELIVERY ROUTES</small><strong>多投递点管理</strong></div>
              <span id="delivery-zone-count">1 / 4</span>
            </div>
            <div id="delivery-zone-list" class="delivery-zone-list"></div>
            <p id="delivery-zone-note">选择一个点，再点击地图移动它。</p>
            <div class="delivery-zone-actions">
              <button id="delivery-zone-add" type="button">添加新点</button>
              <button id="delivery-zone-delete" type="button">删除选中</button>
              <button id="delivery-zone-up" type="button" aria-label="上移选中投递点">↑ 上移</button>
              <button id="delivery-zone-down" type="button" aria-label="下移选中投递点">↓ 下移</button>
            </div>
          </section>
          <p class="tool-hint">先在 2D 中画宽路和放建筑，再切到 3D 检查比例。v5 岛屿可用 R 选择结构；区域和矩形通路块可编辑，桥梁会沿水面移动并自动同步碰撞缺口。</p>
        </aside>

        <section class="map-board">
          <div class="map-meta">
            <label>
              <span>地图名称</span>
              <input id="map-name" maxlength="40" value="我的果园" />
            </label>
            <div class="map-meta-actions">
              <div class="view-switch" role="group" aria-label="地图视图">
                <button class="active" type="button" data-editor-view="2d" aria-pressed="true">2D 编辑</button>
                <button type="button" data-editor-view="3d" aria-pressed="false">3D 预览</button>
              </div>
              <div id="map-status" class="map-status" data-state="checking">正在检查路径…</div>
            </div>
          </div>
          <div id="canvas-shell" class="canvas-shell">
            <canvas id="map-editor-canvas" aria-label="果园地图编辑画布"></canvas>
            <canvas id="map-preview-canvas" aria-label="KayKit 地图三维预览" hidden></canvas>
            <div id="preview-status" class="preview-status" hidden>正在准备 3D 预览…</div>
            <div id="preview-help" class="preview-help" hidden>拖拽旋转 · 滚轮缩放 · 右键平移</div>
            <div id="island-selection" class="island-selection" aria-live="polite" hidden></div>
            <div id="map-legend" class="map-legend" aria-hidden="true">
              <span><i class="legend-kid"></i>小偷</span>
              <span><i class="legend-guard"></i>守卫</span>
              <span><i class="legend-apple"></i>果实</span>
              <span><i class="legend-goal"></i>投递区</span>
              <span><i class="legend-island"></i>岛屿语义</span>
            </div>
          </div>
          <div id="validation-list" class="validation-list" aria-live="polite"></div>
        </section>

        <aside class="seed-lab">
          <div class="panel-heading">
            <span>02</span>
            <div><small>SEED LAB</small><strong>随机地图实验室</strong></div>
          </div>
          <div class="generator-grid">
            <label>结构预置
              <select id="preset-select">
                <option value="village">果园村口</option>
                <option value="pond-garden">池塘花园</option>
                <option value="open-orchard">开阔果园</option>
              </select>
            </label>
            <label>随机种子
              <input id="seed-input" type="number" min="1" step="1" value="20260815" />
            </label>
            <label class="range-control">开放程度 <output id="openness-value">82%</output>
              <input id="openness-input" type="range" min="65" max="94" value="82" />
            </label>
            <label class="range-control">地标覆盖 <output id="landmark-density-value">13%</output>
              <input id="landmark-density-input" type="range" min="6" max="20" value="13" />
            </label>
          </div>
          <button id="generate-button" class="generate-button" type="button">从十二张中筛选四张</button>
          <div id="candidate-list" class="candidate-list" aria-label="随机地图候选"></div>

          <div class="library-heading">
            <span>我的地图</span>
            <div>
              <button id="export-button" type="button">导出</button>
              <button id="import-button" type="button">导入</button>
              <input id="import-input" type="file" accept="application/json,.json" hidden />
            </div>
          </div>
          <div id="saved-map-list" class="saved-map-list"></div>
        </aside>
      </section>
      <div id="editor-toast" class="editor-toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
