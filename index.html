<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8eae62" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='21' fill='%23d83f2f'/%3E%3Cpath d='M33 16c2-8 8-11 15-10-2 7-7 11-15 10Z' fill='%234f7c3a'/%3E%3Cpath d='M31 18c0-5 1-9 4-13' fill='none' stroke='%236f5435' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Apple Picking · 果园追逐</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="双人果园追逐游戏画面"></canvas>

      <section id="score-ribbon" aria-live="polite">
        <div class="team-score guards-score">
          <span class="team-name">守卫抓捕</span>
          <strong><span id="catches-value">0</span>/<span id="catches-total">3</span></strong>
          <span class="progress-track"><span id="catches-fill"></span></span>
        </div>
        <div class="round-clock">
          <span>用时</span>
          <strong id="timer-value">00:00</strong>
          <small class="fps-readout" aria-hidden="true"><span id="fps-value">--</span> FPS</small>
        </div>
        <div class="team-score kid-score">
          <span class="team-name">苹果送达</span>
          <strong><span id="delivered-value">0</span>/<span id="delivered-total">6</span></strong>
          <span class="progress-track"><span id="delivered-fill"></span></span>
        </div>
      </section>

      <aside id="state-strip">
        <div><span class="dot guard1-dot"></span><b>蓝守卫</b><span id="guard1-state">飞扑就绪</span></div>
        <div><span class="dot guard2-dot"></span><b>绿守卫</b><span id="guard2-state">飞扑就绪</span></div>
        <div><span class="dot kid-dot"></span><b>kid</b><span id="kid-state">寻找苹果</span></div>
      </aside>

      <div id="carried-badge">背包 <strong id="carried-value">0</strong></div>
      <div id="status-line">守卫抓人，kid 偷果</div>
      <div id="match-message" aria-hidden="true">3</div>

      <section id="controls" aria-label="键位说明">
        <span><b>蓝守卫</b> ESDF · A 飞扑</span>
        <span><b>绿守卫</b> IJKL · ; 飞扑</span>
        <span><b>kid</b> 方向键 · 右 Ctrl 拾取 · 右 Shift 丢果 / 区内送达</span>
        <span><b>R</b> 重开</span>
      </section>

      <section id="result-overlay" role="dialog" aria-modal="true">
        <p>这一轮结束</p>
        <h1 id="result-title">守卫抓住了小偷！</h1>
        <span>按 R 立即再来一局</span>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
